name: Metabase

# Controls when the workflow will run
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'metabase-*.*.*'
    tags:
      - '*.*.*'
    paths:
      - 'metabase/Dockerfile'
      - 'metabase/run.sh'
      - 'metabase/rootfs/**'
      - '.github/workflows/metabase.yml'

# A newer push to the same branch cancels the run that is still building.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metabase:
    runs-on: ${{ matrix.RUNNER }}
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          # AMD64
          - DOCKER_TAG_SUFFIX: amd64
            S6_ARCH: amd64
            BASE_IMAGE: metabase/metabase:v0.65.5.1
            PLATFORMS: linux/amd64
            RUNNER: ubuntu-latest

          # ARM64V8, built on a native ARM runner instead of under QEMU
          - DOCKER_TAG_SUFFIX: aarch64
            S6_ARCH: aarch64
            BASE_IMAGE: metabase/metabase:v0.65.5.1
            PLATFORMS: linux/arm64
            RUNNER: ubuntu-24.04-arm

    env:
      IMAGE: ghcr.io/${{ github.repository }}/ha-metabase-${{ matrix.DOCKER_TAG_SUFFIX }}

    steps:
      # Get the repository's code
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get the version from config.json
        id: data
        run: |
          version=$(jq --raw-output '.version' ./metabase/config.json)
          echo "HA_RELEASE=$version" >> "$GITHUB_OUTPUT"
          echo "Metabase add-on $version"
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version branch builds and tests the image. A merge to main tags that same image
      # latest instead of rebuilding it, and builds only a version that does not exist yet.
      - name: Check whether this version is already published
        id: existing
        if: github.ref == 'refs/heads/main'
        env:
          HA_RELEASE: ${{ steps.data.outputs.HA_RELEASE }}
        run: |
          if docker manifest inspect "$IMAGE:$HA_RELEASE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$HA_RELEASE already exists, tagging it latest without a rebuild"
          fi
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Tag the published version latest
        if: steps.existing.outputs.exists == 'true'
        env:
          HA_RELEASE: ${{ steps.data.outputs.HA_RELEASE }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$HA_RELEASE"
      - name: Docker meta
        id: meta
        if: steps.existing.outputs.exists != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.data.outputs.HA_RELEASE }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push
        id: push
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./metabase
          platforms: ${{ matrix.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_FROM=${{ matrix.BASE_IMAGE }}
            HA_RELEASE=${{ steps.data.outputs.HA_RELEASE }}
            BUILD_ARCH=${{ matrix.S6_ARCH }}
      - name: Generate artifact attestation
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
