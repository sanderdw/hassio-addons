name: VoltViz

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'voltviz-*.*.*'
    paths:
      - 'voltviz/Dockerfile'
      - 'voltviz/rootfs/**'
      - 'voltviz/config.json'
      - .github/workflows/voltviz.yml
      - 'voltviz/run.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voltviz:
    name: voltviz (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The add-on version mirrors the upstream VoltViz image it wraps
      - name: Get the version from config.json
        id: data
        run: |
          version=$(jq --raw-output '.version' ./voltviz/config.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base_image=ghcr.io/sanderdw/voltviz:$version" >> "$GITHUB_OUTPUT"
          echo "VoltViz add-on $version on ghcr.io/sanderdw/voltviz:$version"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/ha-voltviz-${{ matrix.arch }}
          tags: |
            type=raw,value=${{ steps.data.outputs.version }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./voltviz
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_FROM=${{ steps.data.outputs.base_image }}
            HA_RELEASE=${{ steps.data.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
      - name: Generate artifact attestation
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/ha-voltviz-${{ matrix.arch }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
