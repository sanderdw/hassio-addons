name: VoltViz

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'voltviz-*.*.*'
    paths:
      - 'voltviz/Dockerfile'
      - 'voltviz/rootfs/**'
      - 'voltviz/config.json'
      - .github/workflows/voltviz.yml
      - 'voltviz/run.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      architectures: ${{ steps.info.outputs.architectures }}
      skip_existing: ${{ steps.info.outputs.skip_existing }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The add-on version mirrors the upstream VoltViz image the Dockerfile builds on.
      # Version branches always publish, so a rerun picks up a republished upstream image;
      # main skips versions that already exist, so a merge keeps the image tested on the branch.
      - name: Get the app info from config.json
        id: info
        env:
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          version=$(jq --raw-output '.version' ./voltviz/config.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "architectures=$(jq --compact-output '.arch' ./voltviz/config.json)" >> "$GITHUB_OUTPUT"
          if [[ "$IS_MAIN" == "true" ]]; then
            echo "skip_existing=$version" >> "$GITHUB_OUTPUT"
          fi
          echo "VoltViz app $version on ghcr.io/sanderdw/voltviz:$version"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ha-voltviz
          registry-prefix: ghcr.io/${{ github.repository }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and push
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./voltviz
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          push: true
          skip-existing: ${{ needs.prepare.outputs.skip_existing }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ha-voltviz
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ghcr.io/${{ github.repository }}
          skip-existing: ${{ needs.prepare.outputs.skip_existing }}
