# Only for Home Assistant ingress: the web interface on port 3000 is served by Metabase itself.
user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Metabase forbids every page in a frame (frame-ancestors 'none'). Home Assistant shows
    # ingress in a frame of its own origin, so allow that origin and keep the rest of the policy.
    map $upstream_http_content_security_policy $content_security_policy {
        "~^(?<before>.*)frame-ancestors [^;]*(?<after>.*)$" "${before}frame-ancestors 'self'${after}";
        default $upstream_http_content_security_policy;
    }

    include /etc/nginx/conf.d/ingress.conf;
}
