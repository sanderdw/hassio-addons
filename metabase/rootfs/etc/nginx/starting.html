<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Metabase is starting</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #212121; --muted: #616161; --accent: #509ee3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #e1e1e1; --muted: #9e9e9e; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
         background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 28rem; text-align: center; }
  .spinner { width: 32px; height: 32px; margin: 0 auto 16px; border: 3px solid var(--muted); border-top-color: var(--accent);
             border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="spinner" aria-hidden="true"></div>
  <h1>Metabase is starting</h1>
  <p>This page reloads by itself. The first start takes a few minutes, longer on a Raspberry Pi.</p>
</main>
</body>
</html>
